services:
  - type: web
    name: healthcare-talentap-api
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        value: sqlite:///./healthcare.db
      - key: CORS_ORIGINS
        value: https://healthcare-talentap.vercel.app,http://localhost:5173
      - key: DEMO_MODE
        value: "true"
      - key: SYNTHETIC_DATA_BANNER
        value: "true"
